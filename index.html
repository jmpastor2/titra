    <!--
      The two faces the first screen paints with (Space Grotesk headings, JetBrains Mono readouts,
      latin subsets: Spanish and English fit in them). Without the hint the browser only asks for
      them after the stylesheet has been applied, so every launch paints in the fallback font and
      swaps a moment later. Vite rewrites these paths to the hashed files the stylesheet uses.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2"
    />
    <!-- Open the connection to the database while the scripts download: the first request of the
      home screen no longer waits for DNS and TLS. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
